<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RaschLab{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google Fonts: IBM Plex Sans and IBM Plex Mono -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    .skip-link {
      position: absolute;
      top: -48px;
      left: var(--space-4);
      background: var(--surface);
      color: var(--scale);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 500;
      font-size: var(--step-14);
      z-index: 100;
      transition: top var(--dur-1) ease-out;
    }

    .skip-link:focus {
      top: var(--space-4);
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--paper);
    }

    .app-header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--rule);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-4) var(--space-6);
      display: flex;
      align-items: baseline;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    .brand-wordmark {
      font-size: var(--step-20);
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .brand-wordmark:hover {
      color: var(--scale);
    }

    .brand-role {
      font-size: var(--step-13);
      color: var(--muted);
      font-weight: 400;
    }

    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--space-8) var(--space-6);
    }

    .app-footer {
      background-color: var(--surface);
      border-top: 1px solid var(--rule);
      margin-top: auto;
    }

    .footer-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-4) var(--space-6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
      font-size: var(--step-12);
      color: var(--muted);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
    }
    .brand-wordmark:active { color: var(--scale); filter: brightness(0.9); }
    @media (prefers-reduced-motion: reduce) { .skip-link, .brand-wordmark { transition: none; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="app-shell">
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand-wordmark">RaschLab</a>
      <span class="brand-role">Workbench analisis dan kalibrasi butir</span>
    </div>
  </header>
  <main id="main-content" class="app-main">
    {% block content %}{% endblock %}
  </main>
  {% block footer %}
  <footer class="app-footer">
    <div class="footer-inner">
      <span>RaschLab v{{ app_version | default('0.1.0') }}</span>
      <span>Analisis Rasch dikotomus pada skala logit</span>
    </div>
  </footer>
  {% endblock %}
</body>
</html>
