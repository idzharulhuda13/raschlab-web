<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
</head>
<body style="margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #F7F4EF; color: #1E2422; line-height: 1.5;">
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 560px; margin: 0 auto; background-color: #FFFFFF; border: 1px solid #DED6CA; border-radius: 8px; padding: 32px;">
    <tr>
      <td>
        <h1 style="margin: 0 0 16px 0; font-size: 20px; font-weight: 600; color: #1E2422; line-height: 1.3;">Reset password RaschLab</h1>
        <p style="margin: 0 0 24px 0; font-size: 15px; color: #59635F; line-height: 1.5;">Klik tombol di bawah ini untuk mengatur ulang password akun RaschLab kamu.</p>
        <div style="margin: 0 0 24px 0;">
          <a href="{{ link }}" style="display: inline-block; background-color: #0E5A47; color: #FFFFFF; text-decoration: none; padding: 12px 24px; font-size: 15px; font-weight: 500; border-radius: 6px;">Ganti password</a>
        </div>
        <p style="margin: 0 0 24px 0; font-size: 13px; color: #59635F; word-break: break-all; line-height: 1.5;">
          Jika tombol tidak berfungsi, buka tautan berikut:<br>
          <a href="{{ link }}" style="color: #0E5A47;">{{ link }}</a>
        </p>
        <hr style="border: none; border-top: 1px solid #DED6CA; margin: 24px 0;">
        <p style="margin: 0; font-size: 13px; color: #59635F;">Tautan berlaku 1 jam.</p>
      </td>
    </tr>
  </table>
</body>
</html>
