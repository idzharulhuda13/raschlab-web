<!-- RaschLab F2.5 | design-system: DESIGN.md | macrostructure: form-narrow -->
{% extends "base.html" %}

{% block title %}Reset Password - RaschLab{% endblock %}

{% block content %}
<section class="band band--narrow">
  <div class="panel">
    <h1 class="auth-title">Reset Password</h1>
    <p class="auth-lead">Masukkan password baru untuk akun kamu.</p>

    {% if error %}
    <div class="alert alert--misfit" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form action="/reset" method="post">
      <input type="hidden" name="token" value="{{ token | default('') }}">

      <div class="field">
        <label for="password" class="field-label">Password baru</label>
        <input type="password" id="password" name="password" required minlength="10" autocomplete="new-password" aria-describedby="password-helper" class="field-input">
        <p id="password-helper" class="field-hint">Password minimal 10 karakter.</p>
      </div>

      <button type="submit" class="btn btn--primary">Simpan password baru</button>
    </form>

    <div class="auth-links">
      <a href="/login" class="btn btn--ghost">Kembali ke masuk.</a>
    </div>
  </div>
</section>
{% endblock %}
