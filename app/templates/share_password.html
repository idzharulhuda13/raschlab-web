<!-- RaschLab share gate | design-system: DESIGN.md | macrostructure: form-narrow -->
{% extends "base.html" %}

{% block title %}Hasil dibagikan - RaschLab{% endblock %}

{% block content %}
<section class="band band--narrow">
  <div class="panel">
    <h1 class="auth-title">Hasil dibagikan</h1>
    <p class="auth-lead">Masukkan password dari pemilik hasil untuk membuka dashboard.</p>

    {% if error %}
    <div class="alert alert--misfit" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="post">
      <div class="field">
        <label for="share-password" class="field-label">Password</label>
        <input type="password" id="share-password" name="password" required autocomplete="current-password" class="field-input">
      </div>

      <button type="submit" class="btn btn--primary">Buka hasil</button>
    </form>
  </div>
</section>
{% endblock %}
